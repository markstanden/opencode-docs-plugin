name: "Publish Package"

# Trusted publishing: npm accepts this publish through a GitHub OIDC token,
# checked against the package's configured trusted publisher — repo, workflow
# filename `npm--publish.yml`, environment `npm-publish`. There is no
# NPM_TOKEN to leak, and provenance attestations are generated automatically
# for a public package in a public repository.
#
# A tag is a publish. The guards below refuse anything but the intended
# artefact: a v<package.json version> tag whose commit is already on main.
# The `npm-publish` environment is the human pause; reviewers belong in the
# repository's environment settings, not in this file.
#
# This package ships `src` as written — there is no build step, so the tag is
# the artifact.

on:
    push:
        tags:
            - "v*"
    # Run workflow -> pick the v* tag in the ref selector. A branch ref fails
    # the first step rather than publishing whatever happens to be on it.
    workflow_dispatch:

permissions:
    contents: read
    # The OIDC token npm exchanges for a short-lived, publish-scoped token.
    id-token: write

concurrency:
    group: npm-publish-${{ github.ref }}
    # A publish is not cancellable: finish or fail, never stop mid-flight.
    cancel-in-progress: false

jobs:
    publish:
        # Hosted runners only — npm does not accept OIDC from self-hosted ones.
        runs-on: ubuntu-26.04
        environment:
            name: npm-publish
            url: https://www.npmjs.com/package/@markstanden/opencode-docs-plugin
        steps:
            - name: Require a v* tag
              shell: bash
              env:
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  if [[ "${REF_TYPE}" != "tag" || "${REF_NAME}" != v* ]]; then
                    echo "::error::publishing runs from a v* tag, not ${REF_TYPE} '${REF_NAME}'"
                    exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  # Full history so the merge-base check below is meaningful,
                  # and no credentials left in .git/config.
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "26"
                  registry-url: "https://registry.npmjs.org"
                  # Never cache in a release build: the tarball must come from
                  # the lockfile as written, not from a restored cache.
                  package-manager-cache: false

            - name: Check the tag is a release of main
              shell: bash
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  VERSION="$(node -p "require('./package.json').version")"
                  if [[ "v${VERSION}" != "${TAG}" ]]; then
                    echo "::error::tag ${TAG} does not match package.json version v${VERSION}"
                    exit 1
                  fi

                  # The tagged commit must already be on main, i.e. it came
                  # through the pull request and the gate on main.
                  git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
                  if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
                    echo "::error::${GITHUB_SHA} is not on main — tag the merge commit you intend to release"
                    exit 1
                  fi

            - name: Install
              run: npm ci

            - name: Run defined gate
              # Mirrors .github/workflows/defined--verify.yml: same committed
              # pin, same read-only verb. `comply` is the local repair loop and
              # has no place here — it rewrites the tree we are about to pack.
              shell: bash
              run: |
                  set -euo pipefail

                  PIN="$(jq -r '.version // empty' .defined.json)"
                  REPO_ROOT="$(git rev-parse --show-toplevel)"

                  docker run --rm \
                    --user "$(id -u):$(id -g)" \
                    -v "${REPO_ROOT}:/repo:ro" \
                    -e "NUGET_PACKAGES=/home/node/.nuget/packages" \
                    --workdir /repo \
                    "ghcr.io/markstanden/defined:${PIN:-latest}" verify

            - name: Publish
              # Provenance is automatic under OIDC; the flag states the intent
              # explicitly.
              run: npm publish --access public --provenance
